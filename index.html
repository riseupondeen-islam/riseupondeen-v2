html.light-mode body #preloader.rud-intro{background:#fbf8f1;color:#94701f}
.rud-intro-sky{position:absolute;inset:0;background:radial-gradient(70% 46% at 50% 44%,rgba(217,186,114,.22),transparent 70%),radial-gradient(120% 60% at 50% 115%,rgba(38,64,84,.42),transparent 70%),linear-gradient(180deg,#04060a 0%,#0a1117 58%,#06080b 100%);animation:rudInFade .8s ease-out both}

.rud-intro-stage{position:relative;display:grid;justify-items:center;width:min(420px,88vw);text-align:center}
.rud-intro-mosque{display:block;width:88%;height:auto;overflow:visible}
.rud-intro-mosque .g1{stop-color:#f6dc94}.rud-intro-mosque .g2{stop-color:#b8862e;stop-opacity:.5}
